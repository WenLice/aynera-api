services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elaris
      POSTGRES_PASSWORD: elaris
      POSTGRES_DB: elaris
    ports:
      - "5432:5432"
    volumes:
      - elaris_pg:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ELARIS_DB_CONNECTION: Host=postgres;Port=5432;Database=elaris;Username=elaris;Password=elaris
      ELARIS_REDIS: redis:6379
      ELARIS_JWT_SIGNING_KEY: dev-only-elaris-jwt-signing-key-change-in-prod-32chars
      ELARIS_JWT_ISSUER: elaris-api
      ELARIS_JWT_AUDIENCE_MEMBER: member
      ELARIS_JWT_AUDIENCE_ADMIN: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  elaris_pg:
