services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aynera
      POSTGRES_PASSWORD: Admin@1
      POSTGRES_DB: aynera
    ports:
      - "5432:5432"
    volumes:
      - aynera_pg:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      AYNERA_DB_CONNECTION: Host=postgres;Port=5432;Database=aynera;Username=aynera;Password=Admin@1
      AYNERA_REDIS: redis:6379
      AYNERA_JWT_SIGNING_KEY: dev-only-aynera-jwt-signing-key-change-in-prod-32chars
      AYNERA_JWT_ISSUER: aynera-api
      AYNERA_JWT_AUDIENCE_MEMBER: member
      AYNERA_JWT_AUDIENCE_ADMIN: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  aynera_pg:
