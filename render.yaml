# Render blueprint for the Aynera API.
#
# `main` is the release branch: day-to-day work happens on `dev` and is merged here
# when it should go live. Render auto-deploys on every push to this branch.
#
# The database is NOT declared here on purpose. Render's free PostgreSQL is deleted
# 30 days after creation, which would take the early-access waitlist with it, so the
# connection string points at an external free Postgres (Neon or Supabase) and is set
# in the dashboard rather than committed.
#
# Redis IS required unless you opt out. OTP challenges and the public-form rate limiter
# live in Redis outside the Testing environment; without AYNERA_REDIS the app falls back to
# localhost:6379 and every request that touches either one fails.
#
# Two ways to satisfy it, both set in the dashboard:
#   AYNERA_REDIS                     -> a managed Redis (Upstash and Redis Cloud both have a
#                                       free tier). Survives restarts. Preferred.
#   Aynera__UseInMemoryOtpStore=true -> no Redis at all. Only safe on ONE instance, and
#                                       challenges are lost whenever the instance restarts
#                                       or Render spins it down after 15 idle minutes, so a
#                                       member can lose a code between request and verify.
services:
  - type: web
    name: aynera-api
    runtime: docker
    plan: free
    branch: main
    region: singapore
    dockerfilePath: ./src/Dockerfile
    dockerContext: ./src
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The port is left to the Dockerfile, which binds 8080 and EXPOSEs it; Render
      # detects that. Overriding ASPNETCORE_URLS here would only risk disagreeing with it.
      #
      # External Postgres. Set in the dashboard; never commit a connection string.
      - key: ConnectionStrings__Aynera
        sync: false
      # REQUIRED. appsettings.json ships a "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      # placeholder, so deploying without this would sign every token with a value that
      # is public in the repository.
      #
      # generateValue has Render mint a base64-encoded 256-bit secret on first deploy, so
      # nobody has to generate or handle one by hand. It is generated once and kept across
      # deploys; replacing it invalidates every existing session.
      - key: Aynera__Jwt__SigningKey
        generateValue: true
      # Managed Redis connection string, e.g. Upstash:
      #   <host>:6379,password=<token>,ssl=True,abortConnect=False
      # abortConnect=False lets the app start even if Redis is briefly unreachable.
      # Leave unset only if Aynera__UseInMemoryOtpStore is "true".
      - key: AYNERA_REDIS
        sync: false
      # "true" runs OTP and rate limiting in memory, with no Redis. One instance only.
      - key: Aynera__UseInMemoryOtpStore
        sync: false
      # Set to "true" in the dashboard to serve Swagger on a deployed instance, and back to
      # "false" when you are done. Do NOT switch ASPNETCORE_ENVIRONMENT to Development for
      # this instead: that also picks up appsettings.Development.json, which reveals OTP
      # codes in the logs.
      - key: Aynera__ExposeSwagger
        sync: false
      # First admin, created only when no admin exists yet. Leave unset to skip seeding.
      - key: Aynera__AdminSeed__Email
        sync: false
      - key: Aynera__AdminSeed__Password
        sync: false
