# Render blueprint for the Aynera API.
#
# `main` is the release branch: day-to-day work happens on `dev` and is merged here
# when it should go live. Render auto-deploys on every push to this branch.
#
# The database is NOT declared here on purpose. Render's free PostgreSQL is deleted
# 30 days after creation, which would take the early-access waitlist with it, so the
# connection string points at an external free Postgres (Neon or Supabase) and is set
# in the dashboard rather than committed.
#
# Redis IS required unless you opt out. OTP challenges and the public-form rate limiter
# live in Redis outside the Testing environment; without AYNERA_REDIS the app falls back to
# localhost:6379 and every request that touches either one fails.
#
# Two ways to satisfy it, both set in the dashboard:
#   AYNERA_REDIS                     -> a managed Redis (Upstash and Redis Cloud both have a
#                                       free tier). Survives restarts. Preferred.
#   Aynera__UseInMemoryOtpStore=true -> no Redis at all. Only safe on ONE instance, and
#                                       challenges are lost whenever the instance restarts
#                                       or Render spins it down after 15 idle minutes, so a
#                                       member can lose a code between request and verify.
services:
  - type: web
    name: aynera-api
    runtime: docker
    plan: free
    branch: main
    region: singapore
    dockerfilePath: ./src/Dockerfile
    dockerContext: ./src
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The port is left to the Dockerfile, which binds 8080 and EXPOSEs it; Render
      # detects that. Overriding ASPNETCORE_URLS here would only risk disagreeing with it.
      #
      # External Postgres. Set in the dashboard; never commit a connection string.
      - key: ConnectionStrings__Aynera
        sync: false
      # REQUIRED. appsettings.json ships a "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+"
      # placeholder, so deploying without this would sign every token with a value that
      # is public in the repository.
      #
      # generateValue has Render mint a base64-encoded 256-bit secret on first deploy, so
      # nobody has to generate or handle one by hand. It is generated once and kept across
      # deploys; replacing it invalidates every existing session.
      - key: Aynera__Jwt__SigningKey
        generateValue: true
      # Managed Redis connection string, e.g. Upstash:
      #   <host>:6379,password=<token>,ssl=True,abortConnect=False
      # abortConnect=False lets the app start even if Redis is briefly unreachable.
      # Leave unset only if Aynera__UseInMemoryOtpStore is "true".
      - key: AYNERA_REDIS
        sync: false
      # "true" runs OTP and rate limiting in memory, with no Redis. One instance only.
      - key: Aynera__UseInMemoryOtpStore
        sync: false
      # Set to "true" in the dashboard to serve Swagger on a deployed instance, and back to
      # "false" when you are done. Do NOT switch ASPNETCORE_ENVIRONMENT to Development for
      # this instead: that also picks up appsettings.Development.json, which reveals OTP
      # codes in the logs.
      - key: Aynera__ExposeSwagger
        sync: false
      # Face check (AWS Rekognition Face Liveness + CompareFaces), region ap-south-1. Without the
      # keys the API still starts: face match stays a stub and the face check answers 503.
      # Keys: an IAM user limited to CreateFaceLivenessSession, GetFaceLivenessSessionResults,
      # CompareFaces. IdentityPoolId: the Cognito pool whose guest role may only StartFaceLivenessSession.
      - key: Aynera__Aws__AccessKeyId
        sync: false
      - key: Aynera__Aws__SecretAccessKey
        sync: false
      - key: Aynera__Aws__IdentityPoolId
        sync: false
      # The face-check page this API serves; the app opens it in a WebView.
      - key: Aynera__Liveness__PageUrl
        value: https://aynera-api.onrender.com/liveness/
      # Media storage (Cloudflare R2). Required: the API refuses to start without all four.
      # Use an R2 Account API token scoped Object Read & Write to this one bucket.
      - key: Aynera__R2__AccountId
        sync: false
      - key: Aynera__R2__AccessKeyId
        sync: false
      - key: Aynera__R2__SecretAccessKey
        sync: false
      - key: Aynera__R2__Bucket
        sync: false
      # First admin, created only when no admin exists yet. Leave unset to skip seeding.
      - key: Aynera__AdminSeed__Email
        sync: false
      - key: Aynera__AdminSeed__Password
        sync: false
      # SMS. Without these the provider stays "Console", which sends nothing — and outside
      # Development the code is not logged either, so a member requests an OTP that exists
      # nowhere they can read it and registration cannot be completed at all.
      #
      # 2Factor.in is an Indian OTP route: carriers filter A2P traffic that is not registered
      # under DLT, so a code sent from an international sender may never arrive. Set the
      # provider to "2Factor" and supply the key; the template name can wait until a DLT
      # template is approved, and until then 2Factor uses its own default.
      - key: AYNERA_SMS_PROVIDER
        sync: false
      - key: AYNERA_2FACTOR_API_KEY
        sync: false
      - key: AYNERA_2FACTOR_TEMPLATE
        sync: false
      # Email over plain SMTP — no SDK, no provider-specific code. `SmtpEmailService` is
      # selected whenever AYNERA_EMAIL_PROVIDER is "Smtp" and a host is set, so moving
      # between providers is these variables and nothing else.
      #
      # Current provider is ZeptoMail (Zoho's transactional service, India DC):
      #   host smtp.zeptomail.in, port 587 STARTTLS (465 is TLS Wrapper, also supported),
      #   username the literal "emailapikey", password the Mail Agent's send-mail token.
      # Transactional mail is deliberately kept off the wenlice.com mailbox so OTP bursts
      # never compete with staff mail for its daily cap.
      #
      # Two alternatives, both drop-in: Zoho Mail SMTP (smtp.zoho.in, full address as the
      # username, app-specific password) once the free ZeptoMail credit runs out, and Amazon
      # SES (email-smtp.<region>.amazonaws.com) when aynera.com is owned. For SES, note the
      # username and password are SES *SMTP credentials* from the SES console, NOT an AWS
      # access key, and its sandbox reaches only verified recipients until production access
      # is granted.
      - key: AYNERA_EMAIL_PROVIDER
        sync: false
      - key: AYNERA_SMTP_HOST
        sync: false
      - key: AYNERA_SMTP_PORT
        sync: false
      - key: AYNERA_SMTP_USERNAME
        sync: false
      - key: AYNERA_SMTP_PASSWORD
        sync: false
      # Must be an address on the provider's verified sending domain, and it is what members
      # see as the sender. Today: an address at wenlice.com, verified in ZeptoMail.
      - key: AYNERA_SMTP_FROM
        sync: false
      # Where the verification link in a registration email points. Left unset it falls back to
      # http://localhost:5173/verify-email — a developer's own machine.
      - key: AYNERA_EMAIL_VERIFY_LINK_BASE_URL
        sync: false
