services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elaris
      POSTGRES_PASSWORD: elaris
      POSTGRES_DB: elaris
    ports:
      - "5432:5432"
    volumes:
      - elaris_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  elaris_pg:
